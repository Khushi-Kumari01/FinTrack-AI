openapi: 3.0.0
info:
  title: FinTrack MultiAgent API
  version: 1.0.0
servers:
  - url: http://localhost:5000/api
paths:
  /auth/login:
    post:
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Logged in
  /transactions:
    get:
      summary: Get current user's transactions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of transactions
  /insights:
    get:
      summary: Get spending insights
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Insights object
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
